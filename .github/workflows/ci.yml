name: Docker CI

on:
    push:
        branches:
            - main
            - develop

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Check Docker version
              run: docker --version

            - name: Build Docker image
              run: docker build -t devops-test:latest .

            - name: Test Docker image
              run: docker run --rm devops-test:latest

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Tag Docker Image
              run: |
                  IMAGE="${{ vars.DOCKER_USERNAME }}/devops-test"
                  docker tag devops-test:latest "$IMAGE:v1.${GITHUB_RUN_NUMBER}"
                  docker tag devops-test:latest "$IMAGE:latest"

            - name: Push Docker Image
              run: |
                  IMAGE="${{ vars.DOCKER_USERNAME }}/devops-test"
                  docker push "$IMAGE:v1.${GITHUB_RUN_NUMBER}"
                  docker push "$IMAGE:latest"
